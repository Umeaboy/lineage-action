name: build-for-o1s-self-hosted

on: workflow_dispatch

jobs:
  build-for-o1s:
    runs-on: ubuntu-latest
    
    # Set global environment variables
    env:
      USE_CCACHE: 1
      CCACHE_EXEC: /usr/bin/ccache
    
    steps:
    # 1. Install packages
    - name: Installing dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2_amd64.deb
        rm -f libtinfo5_6.3-2_amd64.deb
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb
        sudo dpkg -i libncurses5_6.3-2_amd64.deb
        rm -f libncurses5_6.3-2_amd64.deb

    # 2. Setup Git and prepare folders
    - name: Authenticating "repo" and preparing directories
      run: |
        git config --global user.email "lovaren@gmail.com"
        git config --global user.name "Kristoffer Grundström"
        mkdir -p ~/bin
        mkdir -p ~/android/lineage

    # 3. Get the repo tool
    - name: Installing the "repo" Tool
      run: |
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo

    # 4. Initiate the source code
    - name: Setting up a local repo
      run: |
        cd ~/android/lineage
        ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-22.1 --git-lfs --depth=1

    # 5. Configure ccache
    - name: Enabling caching
      run: |
        ccache -M 25G

    # 6. Sync the source code
    - name: Syncing sources
      run: |
        cd ~/android/lineage
        ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    # 7. Clone the necessary repos for this device, source and build in the same step
    - name: Setting up build environment and starting build
      run: |
        cd ~/android/lineage
        
        # Clone if they don't already exist
        git clone https://github.com/exynos-republic/android_device_samsung_universal2100-common -b lineage-22.1 device/samsung/universal2100-common || true
        git clone https://github.com/exynos-republic/android_device_samsung_o1s -b lineage-22.1 device/samsung/o1s || true
        git clone https://github.com/exynos-republic/android_device_samsung_slsi_sepolicy -b lineage-22.1 device/samsung_slsi/sepolicy || true
        git clone https://github.com/exynos-republic/android_kernel_samsung_universal2100 -b lineage-22.1 kernel/samsung/universal2100 || true
        git clone https://github.com/exynos-republic/android_vendor_samsung_o1s -b lineage-22.1 vendor/samsung/o1s || true
        git clone https://github.com/exynos-republic/android_vendor_samsung_universal2100-common -b lineage-22.1 vendor/samsung/universal2100-common || true
        git clone https://github.com/exynos-republic/android_hardware_samsung -b lineage-22.1 hardware/samsung || true
        git clone https://github.com/exynos-republic/android_hardware_samsung_slsi-linaro_graphics -b lineage-22.1 hardware/samsung_slsi-linaro/graphics || true
        git clone https://github.com/exynos-republic/android_hardware_samsung_slsi-linaro_exynos -b lineage-22.1 hardware/samsung_slsi-linaro/exynos || true
        git clone https://github.com/exynos-republic/android_hardware_samsung_slsi-linaro_config -b lineage-22.1 hardware/samsung_slsi-linaro/config || true
        git clone https://github.com/exynos-republic/android_hardware_samsung_slsi-linaro_exynos5 -b lineage-22.1 hardware/samsung_slsi-linaro/exynos5 || true
        git clone https://github.com/exynos-republic/android_hardware_samsung_slsi-linaro_openmax -b lineage-22.1 hardware/samsung_slsi-linaro/openmax || true
        git clone https://github.com/exynos-republic/android_hardware_samsung_slsi-linaro_codec2 -b lineage-22.1 hardware/samsung_slsi-linaro/codec2 || true
        git clone https://github.com/exynos-republic/android_hardware_samsung_slsi-linaro_interfaces -b lineage-22.1 hardware/samsung_slsi-linaro/interfaces || true
        
        # Read the environment
        export PATH=$PATH:~/bin
        source build/envsetup.sh
        lunch lineage_o1s-userdebug
        
        # Start the build
        mka bacon

    - name: Get current time
      uses: srfrnk/current-time@master
      id: current-time
      with:
        format: YYYY-MM-DD

    - name: Adding the build to Releases
      uses: softprops/action-gh-release@v1
      with:
        name: "Auto Build ${{ steps.current-time.outputs.formattedTime }}"
        tag_name: "build-${{ steps.current-time.outputs.formattedTime }}"
        prerelease: false
        body: |
          This is an automatic release by GitHub Actions.
        # Tips: Eftersom $OUT försvinner mellan steg, använd den explicita sökvägen till out-mappen här
        files: |
          /home/runner/android/lineage/out/target/product/o1s/recovery.img
          /home/runner/android/lineage/out/target/product/o1s/lineage-*-o1s.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
